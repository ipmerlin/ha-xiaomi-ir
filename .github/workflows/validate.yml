name: Validate
on: [push, pull_request, workflow_dispatch]
jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect hassfest category schema
        run: >-
          docker run --rm --entrypoint python3 ghcr.io/home-assistant/hassfest
          -c "import inspect; import script.hassfest.manifest as m; s=inspect.getsource(m); print(s[max(0,s.find(\"categories\")-600):s.find(\"categories\")+1400])"
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
